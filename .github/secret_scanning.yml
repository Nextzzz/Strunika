# GitHub secret scanning flagged "Google API Key" in src/Strunika.YouTube —
# that is YouTube's own public InnerTube client key, hard-coded in upstream
# YoutubeExplode (YoutubeHttpHandler.cs) and present in every youtube.com page.
# It is not a credential of ours and cannot be rotated. The vendored source
# is excluded so every future sync does not raise the same alert.
paths-ignore:
  - "src/Strunika.YouTube/**"
