# Builds a signed iOS build on a macOS runner and sends it to TestFlight.
#
# Windows cannot do this alone: deploying to a device without a Mac needed Hot
# Restart, which Visual Studio 2026 dropped and which never supported the
# XCFrameworks this app links (ONNX Runtime). So the Mac lives here.
#
# It is manual on purpose — macOS minutes bill at ten times the rate on a
# private repository, and a phone build is not something every push needs.
#
# Secrets it expects (Settings ▸ Secrets and variables ▸ Actions):
#   IOS_DIST_CERT_P12       base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD  the password that .p12 was exported with
#   IOS_PROVISION_PROFILE   base64 of the App Store .mobileprovision
#   APPSTORE_KEY_ID         App Store Connect API key id (10 characters)
#   APPSTORE_ISSUER_ID      the issuer id (a UUID) shown above the key list
#   APPSTORE_API_KEY        base64 of the AuthKey_XXXXXXXXXX.p8 file
name: iOS · TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send the build to TestFlight (off = just build and keep the .ipa)
        type: boolean
        default: true
      fast:
        description: Fast build — interpret MAUI/BCL/packages, AOT only our code (off = full AOT, takes hours untrimmed)
        type: boolean
        default: true

jobs:
  build:
    # The SDK comes from src/Strunika.Mobile/global.json (.NET 10); its iOS
    # workload is 26.x and wants a matching Xcode, which only macos-26 carries.
    runs-on: macos-26
    timeout-minutes: 150

    defaults:
      run:
        # Every dotnet command runs where global.json lives, so the runner builds
        # with exactly the SDK the workstation does.
        working-directory: src/Strunika.Mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1                      # the history carries the models: shallow is much faster

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/Strunika.Mobile/global.json

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The workload refuses an Xcode older than the one it was built against
          # and tolerates a newer one, so any 26.x will do — but not every 26.x on
          # the image is whole: Xcode_26.6.0.app shipped without a macOS SDK, and
          # the iOS build locates actool through that SDK ("unable to find utility
          # actool"). So each candidate is tried for real, image default first,
          # then the rest newest-first, and the first one that has an SDK and an
          # actool wins. No version is hard-coded: that broke two runs already.
          DEFAULT=$(dirname "$(dirname "$(xcode-select -p)")")
          PICK=""
          for APP in "$DEFAULT" $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            [ -d "$APP" ] || continue
            DEV="$APP/Contents/Developer"
            VER=$(DEVELOPER_DIR="$DEV" xcodebuild -version 2>/dev/null | head -1 || true)
            case "$VER" in "Xcode 26."*) ;; *) echo "skip $APP: $VER"; continue ;; esac
            DEVELOPER_DIR="$DEV" xcrun --sdk macosx --show-sdk-path >/dev/null 2>&1 || { echo "skip $APP: no macOS SDK"; continue; }
            DEVELOPER_DIR="$DEV" xcrun --sdk iphoneos --find actool >/dev/null 2>&1 || { echo "skip $APP: no actool"; continue; }
            PICK="$APP"
            break
          done
          [ -n "$PICK" ] || { echo "::error::No Xcode 26.x on this image has both a macOS SDK and actool"; exit 1; }
          sudo xcode-select -s "$PICK"
          # DEVELOPER_DIR wins over xcode-select for every tool in the job.
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $PICK"
          xcodebuild -version
          dotnet --version

      - name: Install the iOS workload
        # The runner's .NET may live somewhere the workload installer cannot
        # write to; sudo is the documented way out and harmless otherwise.
        run: |
          dotnet workload restore Strunika.Mobile.csproj || sudo "$(command -v dotnet)" workload restore Strunika.Mobile.csproj

      - name: Import the signing certificate
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A throw-away keychain: the runner is destroyed with the job anyway,
          # but this keeps the certificate out of the default login keychain.
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # The name of the identity is what MSBuild wants; read it rather than
          # asking for one more secret that can go stale.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Signing as: $IDENTITY"
          echo "CODESIGN_KEY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install the provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "Profile: $NAME ($UUID)"
          echo "PROVISION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Publish
        run: |
          set -euo pipefail
          dotnet publish Strunika.Mobile.csproj -f net10.0-ios -c Release -r ios-arm64 -p:ArchiveOnBuild=true -p:ApplicationVersion=${{ github.run_number }} -p:CodesignKey="$CODESIGN_KEY" -p:CodesignProvision="$PROVISION_NAME" -p:EnableCodeSigning=true -p:StrunikaFastIos=${{ inputs.fast }}

      - name: Find the build
        run: |
          set -euo pipefail
          IPA=$(find bin -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::No .ipa was produced"; exit 1; }
          ls -lh "$IPA"
          echo "IPA=src/Strunika.Mobile/$IPA" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: strunika-ios
          path: ${{ env.IPA }}
          if-no-files-found: error

      # The archive's dSYM is what turns a device crash log's raw offsets into
      # method names; without it an .ips from the phone is unreadable.
      - name: Collect the dSYM
        run: |
          set -euo pipefail
          DSYM=$(find bin -type d -name '*.app.dSYM' | head -1)
          test -n "$DSYM" || { echo "::warning::No dSYM found"; exit 0; }
          ditto -c -k --keepParent "$DSYM" "$RUNNER_TEMP/strunika-ios.dSYM.zip"
          echo "DSYM_ZIP=$RUNNER_TEMP/strunika-ios.dSYM.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: ${{ env.DSYM_ZIP != '' }}
        with:
          name: strunika-ios-dsym
          path: ${{ env.DSYM_ZIP }}

      - name: Send to TestFlight
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          set -euo pipefail
          # altool looks for the key in one of a few fixed folders. The secret may
          # hold the .p8 as base64 or as the PEM text itself; both are accepted,
          # and the key is checked before altool gets to complain about it.
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          if echo "$API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$API_KEY" > "$KEYFILE"
          else
            echo "$API_KEY" | tr -d '[:space:]' | base64 --decode > "$KEYFILE"
          fi
          openssl pkey -in "$KEYFILE" -noout 2>/dev/null || { echo "::error::APPSTORE_API_KEY is not a valid .p8 key: paste the one-line base64 of the file, or its full PEM text"; exit 1; }
          IPA_PATH="$GITHUB_WORKSPACE/$IPA"
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app  -f "$IPA_PATH" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
